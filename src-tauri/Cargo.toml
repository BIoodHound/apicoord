[package]
name = "app"
version = "0.0.1"
description = "APICoord desktop shell"
authors = ["Weeznha"]
edition = "2021"
rust-version = "1.75"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# A plain `cargo test` in src-tauri runs both the app crate and the tauri-free core crate.
[workspace]
members = ["core"]
default-members = [".", "core"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
apicoord-core = { path = "core" }
tauri = { version = "2", features = [] }
# Dialogs are driven from Rust only (DialogExt); the webview has no dialog capability.
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "io-util"] }
tracing = "0.1"

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]
